<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Group Calendar — demo</title>
    <meta name="description" content="Sign up to host community group events and say what food you'll bring." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the calendar</a>
    <header class="topbar">
      <h1 id="app-name">Community Group Calendar</h1>
      <div class="topbar-actions">
        <button type="button" id="help-btn" class="btn ghost" aria-controls="intro" aria-expanded="true">
          How to use
        </button>
        <button type="button" id="share-btn" class="btn ghost" title="Copy the link to this calendar">
          Share link
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <button type="button" id="who" class="who" hidden></button>
        <button type="button" id="signout-btn" class="btn ghost" hidden>Sign out</button>
      </div>
    </header>
    <p class="demo-banner">Demo. Nothing is saved; reloading resets the data. After signing out, any email
      and password signs in as an organizer; the invite code for a new account is <strong>demo</strong>.</p>

    <div class="toolbar" hidden>
      <div class="period-nav">
        <button type="button" id="today" class="btn">Today</button>
        <span class="stepper">
          <button type="button" id="prev" class="btn icon" aria-label="Previous month">&#8249;</button>
          <button type="button" id="next" class="btn icon" aria-label="Next month">&#8250;</button>
        </span>
        <h2 id="period">&nbsp;</h2>
      </div>
      <div class="toolbar-right">
        <div class="view-toggle" role="group" aria-label="How to show the events">
          <button type="button" class="btn toggle" data-view="month">Month</button>
          <button type="button" class="btn toggle" data-view="list">Upcoming</button>
        </div>
        <button type="button" id="new-event-btn" class="btn primary" hidden>+ New event</button>
      </div>
    </div>

    <main id="main">
      <section id="gate" class="gate" aria-label="Sign in" hidden></section>
      <section id="intro" class="intro" aria-label="How to use this calendar" hidden></section>

      <section id="loading" class="loading" aria-live="polite">
        <p class="sr-only">Loading the calendar…</p>
        <div class="skeleton-grid" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

      <p id="view-note" class="view-note" hidden></p>

      <section id="calendar" class="calendar" aria-label="Month view" hidden></section>
      <section id="agenda" class="agenda" aria-label="Upcoming events" hidden></section>
    </main>

    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module">
      // The demo runs the whole calendar against in-memory data, so it needs
      // no Supabase project. Reloading the page starts over.
      const [{ createDemoData }, { startApp }, { buildCalendar }] = await Promise.all([
        import('./lib/demo-data.js'),
        import('./app.js'),
        import('./lib/feed.js'),
      ]);
      document.getElementById('app-name').textContent = 'Community Group Calendar';
      document.title = 'Community Group Calendar — demo';
      // The demo's sample feed is built from its own events, in the shape the
      // real feed_data() returns them.
      const buildFeed = (events, me) =>
        buildCalendar(
          events.map((e) => ({
            id: e.id,
            title: e.title,
            description: e.description,
            location: e.location,
            event_date: e.date,
            start_time: e.startTime,
            end_time: e.endTime,
            needs_host: e.needsHost,
            host_limit: e.hostLimit,
            allow_other_food: e.allowOtherFood,
            updated_at: new Date().toISOString(),
            food_slots: e.foodSlots,
            signups: e.signups.map((s) => ({ ...s, slot_id: s.slotId, mine: s.createdBy === me })),
          })),
          { siteUrl: location.origin + location.pathname },
        );
      startApp(createDemoData({ buildFeed }));
    </script>
  </body>
</html>
