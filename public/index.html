<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2c1f4a" />
    <title>Community Group Calendar</title>
    <meta name="description" content="Sign up to host community group events and say what food you'll bring. No account needed." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='6' fill='%232c1f4a'/%3E%3Crect x='3' y='5' width='26' height='3' rx='1.5' fill='%23c79ddb'/%3E%3Crect x='3' y='8' width='26' height='3' fill='%23f4a3b8'/%3E%3Crect x='3' y='11' width='26' height='3' fill='%23ff9a5c'/%3E%3Ccircle cx='16' cy='21' r='4' fill='%23f2a93b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=JetBrains+Mono:wght@400..700&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- The Supabase library comes from here; start the connection early. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the calendar</a>
    <header class="topbar">
      <h1 id="app-name">Community Group Calendar</h1>
      <div class="topbar-actions">
        <button type="button" id="help-btn" class="btn ghost" aria-controls="intro" aria-expanded="true">
          How to use
        </button>
        <button type="button" id="share-btn" class="btn ghost" title="Copy the link to this calendar">
          Share link
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <button type="button" id="who" class="who" hidden></button>
        <button type="button" id="signout-btn" class="btn ghost" hidden>Sign out</button>
        <button type="button" id="signin-btn" class="btn ghost">Organizer sign in</button>
      </div>
    </header>

    <div class="toolbar" hidden>
      <div class="period-nav">
        <button type="button" id="today" class="btn">Today</button>
        <span class="stepper">
          <button type="button" id="prev" class="btn icon" aria-label="Previous month">&#8249;</button>
          <button type="button" id="next" class="btn icon" aria-label="Next month">&#8250;</button>
        </span>
        <h2 id="period">&nbsp;</h2>
      </div>
      <div class="toolbar-right">
        <div class="view-toggle" role="group" aria-label="How to show the events">
          <button type="button" class="btn toggle" data-view="month">Month</button>
          <button type="button" class="btn toggle" data-view="list">Upcoming</button>
        </div>
        <button type="button" id="new-event-btn" class="btn primary" hidden>+ New event</button>
      </div>
    </div>

    <main id="main">
      <section id="intro" class="intro" aria-label="How to use this calendar" hidden></section>

      <section id="loading" class="loading" aria-live="polite">
        <p class="sr-only">Loading the calendar…</p>
        <div class="skeleton-grid" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

      <p id="view-note" class="view-note" hidden></p>

      <section id="calendar" class="calendar" aria-label="Month view" hidden></section>
      <section id="agenda" class="agenda" aria-label="Upcoming events" hidden></section>
    </main>

    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module">
      import { APP_NAME, SUPABASE_ANON_KEY, SUPABASE_URL } from './config.js';
      import { fatalNotice, setupNotice } from './lib/setup-notice.js';

      document.getElementById('app-name').textContent = APP_NAME;
      document.title = APP_NAME;

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        setupNotice();
      } else {
        // Open the connection to the project while the library downloads.
        const preconnect = Object.assign(document.createElement('link'), { rel: 'preconnect', href: SUPABASE_URL });
        preconnect.crossOrigin = '';
        document.head.append(preconnect);
        try {
          // The Supabase library comes from a CDN, so this can fail on a
          // blocked network. Without the catch the page would stay blank.
          const [{ createClient }, { createSupabaseData }, { startApp }] = await Promise.all([
            import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm'),
            import('./lib/supabase-data.js'),
            import('./app.js'),
          ]);
          startApp(createSupabaseData(createClient(SUPABASE_URL, SUPABASE_ANON_KEY)));
        } catch (error) {
          fatalNotice(error);
        }
      }
    </script>
  </body>
</html>
