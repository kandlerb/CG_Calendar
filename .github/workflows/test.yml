name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    name: unit (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The unit tests use only node:test, so there is nothing to install.
      - run: npm test

  e2e:
    name: browser (demo page)
    runs-on: ubuntu-latest
    # Playwright's own image already has Chromium and every library it needs.
    # Installing them on a bare runner took most of the job — often minutes,
    # for tests that run in under half a minute. The tag must match the
    # @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      # Playwright is the only dependency, and only the tests use it.
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  schema:
    name: schema (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # pg_isready needs -U postgres; without it the health check connects as
        # root and logs a misleading "role does not exist" FATAL.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Proves the row level security rules and the capacity trigger in
      # supabase/schema.sql actually hold, against a real PostgreSQL.
      - run: ./scripts/test-schema.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  # Publishes public/ once every test above has passed on a push to main.
  # It lives here rather than in a workflow triggered by this one, because a
  # workflow_run trigger did not fire for merges made through the GitHub app.
  # deploy.yml is kept for deploying by hand.
  deploy:
    name: deploy (GitHub Pages)
    needs: [unit, e2e, schema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let a running deploy finish rather than cancelling it half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages has to be switched on once by hand — see the README.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
